# Override Spark's default servlet sink: Spark 4.0.1's shaded Jetty references
# jakarta.servlet.SingleThreadModel, removed from the Servlet API used by Boot 4.
# Reusing ConsoleSink under the servlet sink key keeps metrics initialized without Jetty.
*.sink.servlet.class=org.apache.spark.metrics.sink.ConsoleSink
*.sink.servlet.period=60
*.sink.servlet.unit=seconds
*.sink.console.class=org.apache.spark.metrics.sink.ConsoleSink
*.sink.console.period=60
*.sink.console.unit=seconds

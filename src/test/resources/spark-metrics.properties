# Use a non-servlet sink explicitly for Spark tests. Spark 4.0.1's shaded Jetty
# references jakarta.servlet.SingleThreadModel, which is absent from Boot 4's
# Servlet API. A concrete sink also prevents Spark from falling back to its
# bundled default metrics configuration (which registers the servlet sink).
*.sink.console.class=org.apache.spark.metrics.sink.ConsoleSink
*.sink.console.period=60
*.sink.console.unit=seconds

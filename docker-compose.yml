services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: erplancers
      POSTGRES_USER: erplancers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erplancers -d erplancers"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [erp]

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [erp]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/erplancers
      SPRING_DATASOURCE_USERNAME: erplancers
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SESSION_JDBC_INITIALIZE_SCHEMA: always
      ERP_REGISTRATION_ADMIN_TOKEN: ${ERP_REGISTRATION_ADMIN_TOKEN:?Set ERP_REGISTRATION_ADMIN_TOKEN in .env}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [erp]

  # Opt-in worker. Provide an operator-approved source catalogue before starting this profile.
  analytics-worker:
    profiles: ["analytics"]
    build:
      context: .
      dockerfile: Dockerfile.spark-analytics
    restart: unless-stopped
    environment:
      ANALYTICS_METADATA_JDBC_URL: jdbc:postgresql://postgres:5432/erplancers
      ANALYTICS_METADATA_USER: erplancers
      ANALYTICS_METADATA_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ANALYTICS_READ_JDBC_URL: jdbc:postgresql://postgres:5432/erplancers
      ANALYTICS_READ_USER: ${ANALYTICS_READ_USER:-erplancers}
      ANALYTICS_READ_PASSWORD: ${ANALYTICS_READ_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      ANALYTICS_DATASETS_CONFIG: /run/config/analytics-datasets.properties
      ANALYTICS_ARTIFACT_URI: file:/var/lib/erplancers/analytics
      ANALYTICS_WORKER_ID: analytics-worker-1
      ANALYTICS_IDLE_POLL_MS: 1000
      ANALYTICS_JOB_LEASE_SECONDS: 900
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPARK_MASTER: local[*]
    volumes:
      - ./deploy/analytics-datasets.properties:/run/config/analytics-datasets.properties:ro
      - analytics_artifacts:/var/lib/erplancers/analytics
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [erp]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${ERP_HTTP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [erp]

volumes:
  postgres_data:
  kafka_data:
  analytics_artifacts:

networks:
  erp:
    driver: bridge

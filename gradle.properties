# Bound Gradle memory use while giving the daemon more heap for the Spark/MLlib-heavy build.
# G1GC helps avoid long pauses when the build allocates large dependency/compiler graphs.
org.gradle.jvmargs=-Xms512m -Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true

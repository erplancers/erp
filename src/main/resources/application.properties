spring.application.name=erplancers
spring.data.rest.base-path=/api
spring.jpa.generate-ddl = true
spring.jpa.hibernate.ddl-auto=create
spring.h2.console.enabled=true
#spring.datasource.url=jdbc:postgresql://localhost:5432/erplancers
#spring.datasource.username=postgres
#spring.datasource.password=12345
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
#spring.main.allow-bean-definition-overriding=true
gg.jte.usePrecompiledTemplates=true

# Kafka carries durable-outbox notifications; PostgreSQL remains the analytics job source of truth.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
analytics.kafka.job-queued-topic=erp.analytics.job.queued.v1
analytics.kafka.outbox-poll-ms=1000
analytics.kafka.outbox-batch-size=50

# Enable only after configuring deploy/analytics-datasets.properties and database roles.
analytics.engine.enabled=${ANALYTICS_ENGINE_ENABLED:false}
analytics.kafka.outbox-poll-ms=1000
analytics.kafka.outbox-batch-size=50

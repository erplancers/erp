spring.application.name=erplancers
spring.data.rest.base-path=/api
spring.jpa.generate-ddl = true
spring.jpa.hibernate.ddl-auto=create
spring.h2.console.enabled=true
#spring.datasource.url=jdbc:postgresql://localhost:5432/erplancers
#spring.datasource.username=postgres
#spring.datasource.password=12345
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
#spring.main.allow-bean-definition-overriding=true
gg.jte.usePrecompiledTemplates=true
# Spring Security
# Set ERP_ADMIN_PASSWORD in the environment before starting the application.
# The API fails closed when no password is supplied.
erp.security.users.admin.password=${ERP_ADMIN_PASSWORD}
erp.security.users.admin.authorities=ERP_ADMIN

# Example least-privilege user:
# erp.security.users.accounting.password=${ERP_ACCOUNTING_PASSWORD}
# erp.security.users.accounting.authorities=ERP_MODULE_ACCOUNTING_READ,ERP_MODULE_ACCOUNTING_WRITE

# Repository-level authority example:
# ERP_RESOURCE_CUSTOMER_READ
# ERP_RESOURCE_CUSTOMER_WRITE
# ERP_RESOURCE_CUSTOMER_DELETE

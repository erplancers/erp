# Allocate sufficient heap for the Spark/MLlib-heavy ERP build.
# Keep concurrency low to avoid multiplying memory use across workers.
org.gradle.jvmargs=-Xms1g -Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true

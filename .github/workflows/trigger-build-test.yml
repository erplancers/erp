name: Build Test Trigger

on:
  workflow_dispatch:
  push:
    branches:
      - "chore/trigger-build-test"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew test --no-daemon
      - run: ./gradlew bootJar --no-daemon
